<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Optische Effekte nahe c</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <div id="app">
      <main id="view">
        <canvas id="canvas"></canvas>
        <div id="hint">Ziehen mit der Maus: umschauen · Doppelklick: Blick nach vorn</div>
      </main>

      <aside id="panel">
        <h1>Optische Effekte nahe c</h1>

        <section>
          <h2>Geschwindigkeit</h2>
          <label class="row" for="beta-slider">β = v/c</label>
          <div class="row">
            <input id="beta-slider" type="range" min="0" max="1" step="0.0001" value="0" />
            <input id="beta-input" type="number" min="0" max="0.999" step="0.001" value="0" />
          </div>
          <p class="note">Skala logarithmisch in (1 − β): feiner im oberen Bereich.</p>
        </section>

        <section>
          <h2>Effekte</h2>
          <label class="check"><input id="fx-aberration" type="checkbox" checked /> Aberration (Richtung)</label>
        </section>

        <section>
          <h2>Ansicht</h2>
          <label class="row">Projektion
            <select id="projection">
              <option value="perspective">Perspektive (Kamera)</option>
              <option value="stereographic">Stereografisch (winkeltreu)</option>
            </select>
          </label>
          <label class="row">Sichtfeld <span><output id="fov-out">60</output>°</span></label>
          <input id="fov" type="range" min="20" max="170" step="1" value="60" />
          <label class="row">Belichtung <span><output id="exposure-out">2.0</output> mag</span></label>
          <input id="exposure" type="range" min="-4" max="8" step="0.1" value="2" />
          <label class="row">Anzahl Sterne
            <select id="star-count">
              <option value="10000" selected>10 000</option>
              <option value="20000">20 000</option>
              <option value="30000">30 000</option>
              <option value="50000">50 000</option>
            </select>
          </label>
        </section>

        <section>
          <h2>Debug</h2>
          <table id="debug"></table>
        </section>
      </aside>
    </div>
    <footer id="footer">
      Simulation erstellt mit Claude Code (KI). Physikalische Grundlagen siehe Kapitel 3 der Seminararbeit.
    </footer>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
