# Erstellt mit Claude Code (KI-Werkzeug) im Auftrag von Dominik Wittkow,
# W-Seminar Physik, CSG Ingolstadt, 24.09.2026.
#
# nginx im Container: liefert die gebaute Simulation (dist/index.html) auf
# Port 5000 aus. Die Seite verwendet nur relative Pfade und bettet alles in
# index.html ein; sie funktioniert daher auch, wenn der vorgeschaltete Proxy
# sie unter einem Unterpfad (z. B. /simulation/) bereitstellt.

server {
    listen 5000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    # Weiterleitungen ohne Host/Port, damit hinter dem Proxy nicht auf :5000 verwiesen wird
    absolute_redirect off;

    gzip on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/css application/javascript text/plain image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;

    # für den HEALTHCHECK des Containers
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ =404;
        # immer die aktuelle Version holen (index.html enthält die ganze Anwendung)
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
}
